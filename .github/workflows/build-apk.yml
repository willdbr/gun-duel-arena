name: Compilar APK Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Python e Pillow
        run: |
          python3 -m pip install --upgrade pip
          pip3 install pillow

      - name: Instalar Dependências
        run: npm install

      - name: Inicializar Plataforma Android
        run: |
          npx cap add android

      - name: Gerar Ícones Android Diretamente
        run: |
          python3 - << 'EOF'
          import os
          from PIL import Image

          icon_path = "resources/icon.png"
          if not os.path.exists(icon_path):
              raise FileNotFoundError(f"{icon_path} não encontrado!")

          img = Image.open(icon_path).convert("RGBA")

          # Tamanhos padrão mipmap do Android
          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192
          }

          res_dir = "android/app/src/main/res"
          for folder, size in sizes.items():
              target_dir = os.path.join(res_dir, folder)
              os.makedirs(target_dir, exist_ok=True)
              resized = img.resize((size, size), Image.Resampling.LANCZOS)
              resized.save(os.path.join(target_dir, "ic_launcher.png"), "PNG")
              resized.save(os.path.join(target_dir, "ic_launcher_round.png"), "PNG")
              resized.save(os.path.join(target_dir, "ic_launcher_foreground.png"), "PNG")

          print("Ícones gerados com sucesso em todas as resoluções Android!")
          EOF

      - name: Sincronizar Plataforma Android
        run: |
          npx cap sync android

      - name: Dar permissão ao Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK de Debug
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: GunDuelArena-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
