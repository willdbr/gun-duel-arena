name: Compilar APK Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar Dependências
        run: npm install

      - name: Inicializar Plataforma Android
        run: |
          npx cap add android

      - name: Gerar Ícones e Splash Screens
        run: |
          mkdir -p resources
          npx cordova-res android --skip-config --copy

      - name: Sincronizar Plataforma Android
        run: |
          npx cap sync android

      - name: Dar permissão ao Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK de Debug
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: GunDuelArena-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk